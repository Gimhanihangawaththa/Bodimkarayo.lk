name: Bodimkarayo Continuous Integration

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  backend-ci:
    name: Backend CI (Unit Tests & JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Unit Tests with Coverage
        run: mvn clean test

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend-ci:
    name: Frontend CI (Unit Tests & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Verify Production Frontend Build
        run: npm run build

  docker-build-check:
    name: Docker Build Integrity Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: bodimkarayo-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: bodimkarayo-frontend:test

      - name: Build Admin Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          push: false
          tags: bodimkarayo-admin:test

  deploy:
    name: Continuous Deployment to AWS EC2
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            if [ ! -d "/home/ubuntu/Bodimkarayo.lk" ]; then
              git clone -b main https://github.com/Gimhanihangawaththa/Bodimkarayo.lk.git /home/ubuntu/Bodimkarayo.lk
              cd /home/ubuntu/Bodimkarayo.lk
              cp .env.docker.example .env
            else
              cd /home/ubuntu/Bodimkarayo.lk
              git checkout main
              git pull origin main
            fi
            docker compose up -d --build
            docker image prune -f
