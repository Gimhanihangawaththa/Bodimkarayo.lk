sonar.projectKey=Bodimkarayo
sonar.projectName=Bodimkarayo.lk
sonar.projectVersion=1.0

# Source & Test directories
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src/test
sonar.java.binaries=backend/target/classes

# Exclude test files from main sources, plus non-code docs & build outputs
sonar.exclusions=frontend/src/test/**,**/*.docx,**/*.pptx,**/*.md,**/*.pdf,frontend/node_modules/**,**/target/**,remove_bg,*.m,frontend/dist/**

# JaCoCo test coverage report
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
